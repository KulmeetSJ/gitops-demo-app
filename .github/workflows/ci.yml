name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests (surefire) + Testcontainers integration tests against PostgreSQL (failsafe)
      - run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  image:
    name: Image, scan, SBOM, publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR (main only)
      security-events: write   # upload Trivy SARIF to code scanning
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once, load into the runner's Docker, scan the exact bytes we will push.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (report to code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Trivy gate (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable tag = commit SHA. No :latest (Kyverno will reject it in-cluster anyway).
      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE"
          echo "### Published \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy to dev (GitOps commit)
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: deploy-dev, cancel-in-progress: false }
    steps:
      # Write access to the platform repo ONLY, via a repo-scoped deploy key. No cluster credentials anywhere.
      - uses: actions/checkout@v7
        with:
          repository: KulmeetSJ/gitops-demo-platform
          ssh-key: ${{ secrets.PLATFORM_DEPLOY_KEY }}

      - name: Commit new image tag to envs/dev
        run: |
          yq -i '.image.tag = strenv(GITHUB_SHA)' envs/dev/values.yaml
          if git diff --quiet; then echo "dev already at $GITHUB_SHA"; exit 0; fi
          git config user.name "gitops-demo-app-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "dev: deploy ${GITHUB_SHA::12}" \
            -m "App commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            -m "CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && break
            echo "push rejected (attempt $attempt), rebasing"; sleep $((attempt * 2))
            git pull --rebase origin main
          done
          echo "### Deployed \`${GITHUB_SHA::12}\` to dev via GitOps commit $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
