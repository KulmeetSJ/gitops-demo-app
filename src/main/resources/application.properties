spring.application.name=gitops-demo-app

# Database (overridden per environment via env vars / Kubernetes secrets)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accounts}
spring.datasource.username=${DB_USERNAME:accounts}
spring.datasource.password=${DB_PASSWORD:accounts}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true
server.shutdown=graceful

# Health probes for Kubernetes, Prometheus scrape endpoint for Argo Rollouts analysis
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Fraction (0.0-1.0) of /api/** requests that deliberately fail with HTTP 500.
# Used to demo automated canary rollback. Must stay 0 in normal deployments.
app.fault-rate=${FAULT_RATE:0}
